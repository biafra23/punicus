name: CI

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below).
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request unscoped (any base branch), like the other workflows: a part PR
  # of a multi-PR plan targets its feature branch and still needs Build and Test
  # (CLAUDE.md, "Multi-PR plans").
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git tag --merged HEAD` needs HEAD's history to REACH that tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching. Restores the base-branch cache
      # (read-only on PRs) so artifacts that already built on main come from cache
      # instead of being re-fetched on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :data builds the native Privacy Pools library with cargo (buildPrivacyPoolsHost, into
      # data/build/privacy-pools-cargo): cache its compiled dependencies, keyed on Cargo.lock.
      # The runner's preinstalled rustup installs the toolchain native/privacy-pools names.
      - name: Cache cargo for the Privacy Pools library
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/privacy-pools -> ../../data/build/privacy-pools-cargo

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The security invariants of the source tree (scripts/check_security_invariants.py): the
      # Myotis boundary, the mnemonic's one path, the key store's floors, the biometric keys'
      # parameters, the Android backup and signing rules, the screens under capture protection,
      # the workflows' pins and triggers, the build's repositories. Standard-library Python,
      # seconds, before the build. A violation the baseline (scripts/security-baseline.txt) does
      # not accept fails here; the baseline lists the open findings of the 2026-11-01 audit and
      # shrinks as they are fixed. The script's own tests run first, so a broken check cannot
      # pass silently.
      - name: Check security invariants
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_security_invariants.py'
          python3 scripts/check_security_invariants.py

      # The Android launcher icon is GENERATED from assets/serotine_logo.svg and committed
      # (android-app/src/main/res: ic_launcher_foreground, ic_launcher_background,
      # mipmap-anydpi-v26/ic_launcher; android-app/src/debug/res: the debug app's recoloured
      # icon over the same names), and the desktop and iOS icons are rendered from it at build
      # time (scripts/gen_app_icons.java). Re-run the generator (stdlib-only, seconds) and fail
      # on a diff, so a hand edit to the resources, or an SVG change without a re-run, cannot
      # drift past review. `git diff` alone is blind to an UNTRACKED file (a new or renamed
      # generator output nobody committed), hence the porcelain check behind it.
      - name: Verify generated Android icons match assets/serotine_logo.svg
        run: |
          python3 scripts/gen_android_icons.py
          res="android-app/src/main/res android-app/src/debug/res"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the icons in $res are STALE vs assets/serotine_logo.svg —" \
                 "regenerate with \`python3 scripts/gen_android_icons.py\` and commit every file it writes."
            exit 1
          }

      # The rate widget's asset icons (android-app/src/main/res/drawable/ic_widget_asset_*.xml)
      # and their lookup (android-app/.../widget/WidgetAssetIcons.kt) are GENERATED from
      # ui/.../TokenIcons.kt, since RemoteViews cannot draw a Compose ImageVector directly
      # (scripts/gen_widget_icons.py). Same drift gate as the launcher icon above: re-run and
      # fail on a diff, so a hand edit, or a TokenIcons.kt change without a re-run, cannot drift
      # past review.
      - name: Verify generated widget icons match TokenIcons.kt
        run: |
          python3 scripts/gen_widget_icons.py
          res="android-app/src/main/res/drawable android-app/src/main/kotlin/eth/serotine/android/widget/WidgetAssetIcons.kt"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the widget icons in $res are STALE vs TokenIcons.kt —" \
                 "regenerate with \`python3 scripts/gen_widget_icons.py\` and commit every file it writes."
            exit 1
          }

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent.
      #
      # `build` = every module's assemble + check: the JVM and Android unit tests
      # of :domain, :data and :ui (the headless Compose UI tests among them),
      # Android lint, and the debug + release APK assembly. The installers and
      # the APK gates are the artifact workflows' job (android-apk.yml and the
      # three desktop-*.yml).
      #
      # Retry to ride out transient repository-resolution blips. NOT --offline:
      # offline turns a single cache miss into a hard failure.
      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

      # The test reports, for a red run: JUnit XML + HTML per module.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # The native Privacy Pools library (native/privacy-pools; docs/privacy-pools.md, Part 2;
  # docs/architecture.md, *Native code*): formatting, clippy and its tests, the tests in the crate's
  # optimised `ci` profile, as a proof unoptimised takes minutes. The tests prove both circuits against the reference
  # vectors, so they need the proving keys: the fetch script downloads the pinned npm package and
  # refuses any file whose hash is not the pinned one. The runner's preinstalled rustup installs
  # the stable toolchain native/privacy-pools/rust-toolchain.toml names.
  native:
    name: Native library (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/privacy-pools

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The compiled dependencies (arkworks, the prover, the witness runtime), keyed on Cargo.lock.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/privacy-pools

      - name: Fetch the pinned circuit artifacts
        run: scripts/fetch-artifacts.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --profile ci --locked
