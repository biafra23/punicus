# One host of the `gradle pins` chain (gradle-pins.yml has the narrative). Carried over from
# biafra23/myotis (its #734), where the chain was first proven; adapted for #281 so that the first
# host also WRITES the lockfiles, which lets CI generate every pin from scratch.
#
# 1. CHECK: resolve every configuration with the COMMITTED pins in force. Fails on a hash this
#    host needs that gradle/verification-metadata.xml does not carry (or carries wrong), on a
#    graph that left its gradle.lockfile, and on a configuration that resolves with no lock state
#    at all — which is every configuration while no pins are committed.
# 2. CONTRIBUTE: whatever the check said, start from the previous host's pins (or the committed
#    ones on the first host). The first host (write_locks) rewrites the lockfiles; every host adds
#    its own hashes with --write-verification-metadata and uploads the lockfiles and the metadata
#    for the next host. The last host's upload is the union every host needs, which
#    `scripts/update_gradle_pins.sh --from-ci` downloads. If the previous host's upload is
#    missing, nothing is uploaded here: a "merged" file built from the committed one would
#    silently drop that host's entries.
# 3. Fail the job if step 1 failed — after the upload, so the fix is attached.
#
# Nothing here writes to the repository: the pins reach a branch only through a person who runs
# the update script and reviews the diff. Every action is pinned to a commit (WF-SHA-PIN), and no
# event-controlled value is expanded inside `run:` (WF-RUN-INJECTION).
name: gradle pins (host)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      host:
        description: Short host name, used in messages
        required: true
        type: string
      previous:
        description: Artifact to start step 2 from ('' = the committed pins)
        required: false
        type: string
        default: ''
      upload_as:
        required: true
        type: string
      write_locks:
        description: Rewrite the lockfiles in step 2 (the first host only; locks hold no host-specific module)
        required: false
        type: boolean
        default: false
      extra_tasks:
        description: >-
          Tasks run alongside the walk, for tools AGP resolves through detached configurations
          only while a task runs (aapt2 has a jar per OS)
        required: false
        type: string
        default: ''
      canary:
        description: Also prove that tampered pins fail the check (once pins are committed)
        required: false
        type: boolean
        default: false
      java_architecture:
        description: >-
          Architecture of the JDK Gradle runs on, when it is not the runner's: 'x64' on an Apple
          Silicon runner is the Intel-Mac host (the JDK runs under Rosetta 2, as in
          desktop-dmg.yml's x64 leg). '' = the runner's.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  pins:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXTRA_TASKS: ${{ inputs.extra_tasks }}
      HOST: ${{ inputs.host }}
    steps:
      # Git for Windows checks text files out with CRLF by default, and the bash steps run
      # ./gradlew, whose shebang would then end in \r. A no-op elsewhere.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # An x86_64 JDK on an Apple Silicon runner needs Rosetta 2. Same step as desktop-dmg.yml's
      # x64 leg: fail HERE and loudly if Rosetta is unavailable.
      - name: Install Rosetta 2
        if: ${{ inputs.java_architecture == 'x64' && runner.os == 'macOS' }}
        run: |
          set -o pipefail
          if ! softwareupdate --install-rosetta --agree-to-license 2>&1 | tee /tmp/rosetta.log; then
            grep -qiE "already installed|already been installed" /tmp/rosetta.log \
              || { echo "::error::Rosetta 2 install failed"; exit 1; }
            echo "Rosetta 2 already installed, continuing."
          fi

      # The host of a Gradle build is the JVM it runs on, not the machine: Compose's `currentOs`
      # reads os.arch, so an x64 JDK here resolves the macos-x64 modules. An empty architecture
      # is the runner's own.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: ${{ inputs.java_architecture }}

      # A JDK of the wrong architecture would walk another host's graph and pin nothing new.
      - name: Check the JVM is the host this job is for
        id: jvm
        if: ${{ inputs.java_architecture != '' }}
        env:
          WANT: ${{ inputs.java_architecture }}
        run: |
          arch=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *os\.arch = //p')
          echo "os.arch of the JDK Gradle will run on: $arch"
          case "$WANT:$arch" in
            x64:x86_64|x64:amd64|aarch64:aarch64) ;;
            *) echo "::error::the JDK is $arch, and this host is meant to be $WANT"; exit 1 ;;
          esac

      # COLD cache, deliberately. Gradle reads a parent POM or an imported BOM only while it first
      # parses a module's POM, then caches the parsed result, so a warm cache never touches those
      # files again: a check run there cannot notice that they are unpinned. Only a cold check
      # proves a fresh checkout verifies; the write step after it re-parses with
      # --refresh-dependencies for the same reason.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      # extra_tasks runs an Android resource task, which needs an SDK. Provisioned explicitly
      # instead of trusting each runner image. Hosts without extra_tasks need none: the walk
      # skips the Android configurations when no SDK is present.
      - name: Set up the Android SDK
        if: ${{ inputs.extra_tasks != '' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # Retried once for transient repository errors, NEVER for a pin failure: the first attempt
      # warms the cache, and a second one on it no longer needs a parent POM or BOM the committed
      # pins lack, so a retried pin failure could pass while a cold host fails.
      - name: Check the committed pins on this host
        id: check
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            log="$RUNNER_TEMP/pins-check-$attempt.log"
            # shellcheck disable=SC2086 # EXTRA_TASKS is a task list
            ./gradlew resolveAllDependencies $EXTRA_TASKS --console=plain 2>&1 | tee "$log" \
              && exit 0
            if grep -qE 'Dependency pins do not match|failed verification|dependency lock state' "$log"; then
              echo "::error::a pin failure on attempt $attempt: not retried (a warm cache would hide a missing pin)"
              exit 1
            fi
            echo "::warning::attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      # The check classifies Gradle's failures partly by message text and reaches some of them
      # only through a multi-cause exception's later causes, so a Gradle bump that rewords or
      # reorders them must fail HERE, not turn the check into a silent pass. One case per shape
      # (Myotis's canary also tampers a lock's version; that needs a known older version of a
      # locked module and is left for when one is chosen): a module the lock lacks, a module it
      # has extra, a wrong hash. Each is taken from :domain's committed pins, so the canary
      # needs no module named here. Skipped while no pins are committed.
      - name: Canary — tampered pins must fail the check
        if: ${{ inputs.canary && hashFiles('gradle/verification-metadata.xml', 'domain/gradle.lockfile') != '' }}
        run: |
          set -u
          lock=domain/gradle.lockfile
          meta=gradle/verification-metadata.xml
          if [ ! -f "$lock" ] || [ ! -f "$meta" ]; then echo "no committed pins yet: canary skipped"; exit 0; fi
          # Restore on ANY exit: the tampered files must not reach the steps that follow.
          trap 'git checkout -- "$lock" "$meta"' EXIT
          expect_failure() {
            if out=$(./gradlew :domain:resolveAllDependencies --console=plain 2>&1); then
              echo "::error::$1 passed the check — the pin-failure classifier in build.gradle.kts no longer matches"
              exit 1
            fi
            pins=$(sed -n '/Dependency pins do not match/,$p' <<<"$out")
            grep -Eq -- "$2" <<<"$pins" || {
              echo "$out" | tail -40
              echo "::error::$1 failed, but not as the pin failure it should be (no match for: $2)"
              exit 1
            }
            git checkout -- "$lock" "$meta"
          }
          applied() { git diff --quiet "$lock" "$meta" && { echo "::error::canary edit did not apply: $1"; exit 1; }; true; }

          # The first locked module of :domain, as group:name:version.
          line=$(grep -m1 -E '^[^#=][^=]*:[^=]*:[^=]*=' "$lock")
          module=${line%%=*}
          echo "canary module: $module"
          esc=$(sed 's/[.[\*^$/]/\\&/g' <<<"$module")

          sed -i "/^$esc=/d" "$lock"
          applied "a module the lock lacks"
          expect_failure "a module the lock lacks" "$esc' which is not part of the dependency lock state"

          python3 - "$lock" <<'EOF'
          import sys
          p = sys.argv[1]
          lines = open(p).read().splitlines()
          extra = "org.example.canary:absent:1.0=desktopCompileClasspath"
          at = next((i for i, l in enumerate(lines) if l.startswith("empty=")), len(lines))
          lines.insert(at, extra)
          open(p, "w").write("\n".join(lines) + "\n")
          EOF
          applied "a module the lock has extra"
          expect_failure "a module the lock has extra" \
            "org\.example\.canary:absent:1\.0' which is part of the dependency lock state"

          python3 - "$meta" "$module" <<'EOF'
          import sys
          p, module = sys.argv[1], sys.argv[2]
          group, name, version = module.split(":")
          s = open(p).read()
          i = s.index(f'<component group="{group}" name="{name}" version="{version}">')
          j = s.index('value="', i) + len('value="')
          s = s[:j] + ("1" if s[j] == "0" else "0") + s[j + 1:]
          open(p, "w").write(s)
          EOF
          applied "a wrong hash"
          name=$(cut -d: -f2 <<<"$module" | sed 's/[.[\*^$/]/\\&/g')
          expect_failure "a wrong hash" "$name"

      - name: Start from the previous host's pins
        id: previous
        if: ${{ !cancelled() && inputs.previous != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.previous }}
          path: .

      # Not when this job could not establish the JVM it is for: the walk would then run on the
      # runner's own JDK, add another host's entries, and hand the next host a file that looks
      # like this host's contribution. Nothing is uploaded instead, and the chain stops here, as
      # it does for a missing previous upload.
      #
      # On the first host, the locks first, from the full walk: `lenient` because a bumped
      # dependency is not hash-pinned yet. Then the hashes, with the new locks in force — a
      # separate run on purpose: without lock constraints, conflict resolution also fetches the
      # metadata of every candidate version it then discards, and those would all be pinned.
      # --refresh-dependencies: the check above just warmed this job's cache, and a warm cache
      # never re-reads the parent POMs / BOMs it parsed, so without it this write would miss them.
      - name: Add this host's pins
        id: contribute
        if: >-
          ${{ !cancelled()
              && (inputs.java_architecture == '' || steps.jvm.outcome == 'success')
              && (inputs.previous == '' || steps.previous.outcome == 'success') }}
        env:
          WRITE_LOCKS: ${{ inputs.write_locks }}
        run: |
          for attempt in 1 2; do
            if [ "$WRITE_LOCKS" = true ]; then
              # With the same extra tasks as the hash pass: AGP creates some configurations
              # (androidApis) and settles some graphs only once its tasks are configured, so a lock
              # pass without them writes lock state the hash pass then disagrees with.
              # shellcheck disable=SC2086
              ./gradlew resolveAllDependencies $EXTRA_TASKS --write-locks --dependency-verification lenient \
                --console=plain || { sleep 20; continue; }
            fi
            # shellcheck disable=SC2086
            ./gradlew resolveAllDependencies $EXTRA_TASKS --write-verification-metadata sha256 \
              --refresh-dependencies --console=plain && exit 0
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.contribute.outcome == 'success' }}
        with:
          name: ${{ inputs.upload_as }}
          path: |
            gradle/verification-metadata.xml
            **/*.lockfile
            !**/build/**
            !.gradle/**
          if-no-files-found: error

      - name: Fail if the committed pins are incomplete for this host
        if: ${{ !cancelled() && (steps.check.outcome != 'success' || steps.contribute.outcome != 'success') }}
        env:
          CHECK: ${{ steps.check.outcome }}
          CONTRIBUTE: ${{ steps.contribute.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$CHECK" = skipped ]; then
            echo "::error::the pin check never ran on $HOST: a setup step before it failed."
          elif [ "$CHECK" != success ]; then
            echo "::error::the committed Gradle pins do not cover $HOST (see the check step)." \
                 "Once the whole chain has finished, run scripts/update_gradle_pins.sh --from-ci $RUN_ID, review the diff, and commit it."
          fi
          if [ "$CONTRIBUTE" != success ]; then
            echo "::error::$HOST uploaded no pins (previous host's upload missing, the JVM is not the one this host is for, or the write failed), so this run has no complete merged set."
          fi
          exit 1
