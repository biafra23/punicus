# Gradle dependency pins (#281; carried over from biafra23/myotis, its #734): every CI host
# resolves its full graph against the committed lockfiles and gradle/verification-metadata.xml,
# and fails on a dependency that is not locked or not hash-pinned. docs/gradle-dependency-pins.md
# is the narrative.
#
# Why one job per host: some artifacts exist per build host — Compose desktop's skiko natives,
# Kotlin/Native's compiler bundle, aapt2 — so a pin written on one machine cannot cover the
# others, and a host the metadata misses fails its FIRST Gradle build closed (verification is
# strict). The five hosts here are the five that run Gradle in CI: Linux x64 (Build and Test, the
# APKs, the x64 deb, the screenshots), Linux arm64 (the arm64 deb), macOS arm64 (the arm64 dmg,
# the iOS app), macOS x64 (the Intel dmg, built on an Apple Silicon runner by an x86_64 JDK under
# Rosetta 2, desktop-dmg.yml) and Windows x64 (the msi).
#
# Why a chain and not a matrix: each host adds its entries to the previous host's file, so the
# last upload (`gradle-pins-merged`) is the union, which `scripts/update_gradle_pins.sh --from-ci`
# downloads. The first host also writes the lockfiles (they hold no host-specific module:
# `dependencyLocking.ignoredDependencies` in the root build.gradle.kts), so the chain can generate
# every pin from nothing, which is how the first set was made: no Gradle run outside CI needed.
# Every host still CHECKS the committed pins first and fails on its own gaps; `!cancelled()` keeps
# the chain going past a failed check so the union stays complete.
#
# Nothing here writes to the repository. A person takes the merged upload with the update script,
# reviews the hash diff like code, and commits it: pins that a bumped plugin's code produced are
# never pushed unreviewed.
#
# What the walk does not see: an artifact resolved only while a task RUNS (a plugin's detached
# configuration). aapt2 is the per-host one, covered by `extra_tasks` below; Compose's JDK version
# probe (:desktop-app:checkRuntime) comes from the update script's task pass, and the desktop
# packaging workflows prove it.
#
# Triggers: the files that can change the graph or its pins. Push scoped to main so a branch push
# with an open PR runs once (under pull_request); pull_request unscoped, so part PRs into feature
# branches get it too (.claude/rules/github-workflows.md, *Triggers*).
name: gradle pins

on:
  push:
    branches: [ "main" ]
    paths:
      - "gradle/**"
      - "**/*.gradle.kts"
      - "**/*.lockfile"
      - "gradle.properties"
      - "scripts/update_gradle_pins.sh"
      - ".github/workflows/gradle-pins.yml"
      - ".github/workflows/gradle-pins-host.yml"
  pull_request:
    # Same list as push (kept literal: no YAML anchors in this repo's workflows).
    paths:
      - "gradle/**"
      - "**/*.gradle.kts"
      - "**/*.lockfile"
      - "gradle.properties"
      - "scripts/update_gradle_pins.sh"
      - ".github/workflows/gradle-pins.yml"
      - ".github/workflows/gradle-pins-host.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # aapt2 (AGP's resource compiler) is a jar PER OS, resolved through a detached configuration
  # only while a resource task runs, so one host per OS runs one such task alongside the walk:
  # Linux x64, Windows and macOS arm64, which keeps an Android build on a developer's Mac or
  # Windows machine working. Linux arm64 has no aapt2 build; macOS x64 needs none of its own, the
  # jar being per OS and not per architecture.
  linux-x64:
    uses: ./.github/workflows/gradle-pins-host.yml
    with:
      runner: ubuntu-latest
      host: linux-x64
      upload_as: gradle-pins-linux-x64
      write_locks: true
      extra_tasks: ":android-app:processDebugResources"
      canary: true

  windows-x64:
    needs: linux-x64
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gradle-pins-host.yml
    with:
      runner: windows-latest
      host: windows-x64
      previous: gradle-pins-linux-x64
      upload_as: gradle-pins-windows-x64
      extra_tasks: ":android-app:processDebugResources"

  # GitHub's arm64 runner is free for public repositories only, and a private repository would
  # queue the job forever, so this leg runs while the repository is public, as the arm64 deb does
  # (desktop-linux-deb.yml). Without it, macos-x64 starts from Windows' upload.
  linux-arm64:
    needs: windows-x64
    if: ${{ !cancelled() && !github.event.repository.private }}
    uses: ./.github/workflows/gradle-pins-host.yml
    with:
      runner: ubuntu-24.04-arm
      host: linux-arm64
      previous: gradle-pins-windows-x64
      upload_as: gradle-pins-linux-arm64

  macos-x64:
    needs: linux-arm64
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gradle-pins-host.yml
    with:
      runner: macos-15
      host: macos-x64
      java_architecture: x64
      previous: ${{ github.event.repository.private && 'gradle-pins-windows-x64' || 'gradle-pins-linux-arm64' }}
      upload_as: gradle-pins-macos-x64

  # Last on a Unix host on purpose: Gradle rewrites the whole file on every
  # --write-verification-metadata run, so the merged upload carries LF line endings whatever
  # Windows wrote (update_gradle_pins.sh strips \r as well).
  macos-arm64:
    needs: macos-x64
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gradle-pins-host.yml
    with:
      runner: macos-15
      host: macos-arm64
      previous: gradle-pins-macos-x64
      upload_as: gradle-pins-merged
      extra_tasks: ":android-app:processDebugResources"
